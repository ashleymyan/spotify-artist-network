<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
  :root {
    --bg: #121212; --surface: #181818; --border: #282828;
    --accent: #1DB954; --accent2: #1ed760; --text: #ffffff;
    --muted: #b3b3b3; --card: #282828;
    --label: #b3b3b3; --placeholder: #535353; --arrow: #535353;
    --transition: background 0.3s, color 0.3s, border-color 0.3s;
  }
  :root.light {
    --bg: #ffffff; --surface: #f6f6f6; --border: #e0e0e0;
    --accent: #1DB954; --accent2: #158a3e; --text: #121212;
    --muted: #6a6a6a; --card: #f0f0f0;
    --label: #6a6a6a; --placeholder: #c0c0c0; --arrow: #c0c0c0;
  }
  .theme-toggle {
    position: fixed; top: 20px; right: 24px; z-index: 100;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
    font-family: 'DM Mono', monospace; font-size: 0.7rem;
    color: var(--text); transition: var(--transition);
    display: flex; align-items: center; gap: 6px;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Mono', monospace; min-height: 100vh;
    overflow-x: hidden; transition: var(--transition);
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(200,240,96,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,240,96,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0; opacity: 0;
  }
  :root.light body::before { opacity: 1; }
  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 60px 24px 80px; }
  header { margin-bottom: 56px; text-align: center; }
  .logo {
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.02em; line-height: 1; margin-bottom: 12px;
  }
  .logo span.accent { color: #1DB954; }
  .logo span.accent2 { color: #158a3e; }
  .tagline { font-size: 0.8rem; color: var(--label); letter-spacing: 0.12em; text-transform: uppercase; }
  .search-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin-bottom: 40px; }
  .inputs-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 24px; }
  .arrow-sep { font-size: 1.2rem; color: var(--arrow); text-align: center; font-family: 'Syne', sans-serif; }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--label); }
  .input-group input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 0.9rem; outline: none; transition: border-color 0.2s, background 0.3s, color 0.3s; width: 100%;
  }
  .input-group input:focus { border-color: var(--accent); }
  .input-group input::placeholder { color: var(--placeholder); }
  .controls-row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  .slider-group { flex: 1; min-width: 180px; }
  .slider-group label {
    font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--label); display: flex; justify-content: space-between; margin-bottom: 8px;
  }
  .slider-group label span { color: var(--accent); font-weight: 400; }
  input[type="range"] { -webkit-appearance: none; width: 100%; height: 2px; background: var(--border); border-radius: 2px; outline: none; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: var(--accent); cursor: pointer; transition: transform 0.1s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }
  .mode-group { display: flex; flex-direction: column; gap: 6px; }
  .mode-group label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--label); }
  .mode-toggle { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mode-toggle button {
    flex: 1; padding: 8px 14px; background: none; border: none; color: var(--label);
    font-family: 'DM Mono', monospace; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .mode-toggle button.active { background: var(--accent); color: var(--bg); }
  .search-btn {
    padding: 12px 28px; background: var(--accent); color: var(--bg); border: none;
    border-radius: 8px; font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700;
    letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s; white-space: nowrap; align-self: flex-end;
  }
  .search-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(29,185,84,0.4); }
  .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .mode-hint { font-size: 0.6rem; color: var(--label); margin-top: 6px; font-style: italic; max-width: 220px; line-height: 1.4; }
  .loading { text-align: center; padding: 60px 0; display: none; }
  .loading.visible { display: block; }
  .spinner {
    width: 40px; height: 40px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 0.75rem; color: var(--label); letter-spacing: 0.08em; }
  .error-msg {
    background: rgba(240,96,96,0.08); border: 1px solid rgba(240,96,96,0.25);
    border-radius: 12px; padding: 20px 24px; color: #f08080; font-size: 0.85rem; display: none; text-align: center;
  }
  .error-msg.visible { display: block; }
  .results { display: none; animation: fadeUp 0.4s ease forwards; }
  .results.visible { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .results-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
  .results-title { font-family: 'Syne', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--label); }
  .path-score-badge { font-size: 0.75rem; padding: 4px 12px; border-radius: 999px; border: 1px solid; font-family: 'DM Mono', monospace; }
  .path-viz { display: flex; align-items: stretch; gap: 0; margin-bottom: 40px; overflow-x: auto; padding-bottom: 8px; }
  .path-node { display: flex; flex-direction: column; align-items: center; min-width: 140px; }
  .node-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 14px; text-align: center; width: 100%; transition: border-color 0.2s;
  }
  .node-card:hover { border-color: #444; }
  .node-card.start { border-color: rgba(29,185,84,0.5); }
  .node-card.end { border-color: rgba(29,185,84,0.2); }
  .node-name { font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; line-height: 1.2; }
  .node-tracks { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .node-tracks li { font-size: 0.65rem; color: var(--label); letter-spacing: 0.02em; line-height: 1.4; }
  .node-tracks li::before { content: '♪ '; color: var(--placeholder); }
  .path-edge { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; padding: 0 4px; flex-shrink: 0; padding-top: 20px; }
  .edge-line { width: 100%; height: 1px; position: relative; }
  .edge-score { font-size: 0.6rem; margin-top: 6px; font-family: 'DM Mono', monospace; font-style: italic; }
  @media (max-width: 600px) {
    .inputs-row { grid-template-columns: 1fr; }
    .arrow-sep { display: none; }
    .path-viz { flex-direction: column; align-items: stretch; }
    .path-edge { flex-direction: row; min-width: unset; padding-top: 0; padding: 8px 0; }
    .edge-line { height: 1px; width: 40px; }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle">☀ light</button>
<div class="container">
    <header>
        <div class="logo"><span class="accent">artist</span><span class="accent2">network</span></div>
        <p class="tagline">find the path between any two artists</p>
    </header>
    <div class="search-card">
        <div class="inputs-row">
            <div class="input-group">
                <label>Start artist</label>
                <input type="text" id="startInput" placeholder="e.g. Taylor Swift" autocomplete="off" spellcheck="false">
            </div>
            <div class="arrow-sep">→</div>
            <div class="input-group">
                <label>Target artist</label>
                <input type="text" id="targetInput" placeholder="e.g. Billie Eilish" autocomplete="off" spellcheck="false">
            </div>
        </div>
        <div class="controls-row">
            <div class="mode-group">
                <label>Path mode</label>
                <div class="mode-toggle">
                    <button class="active" data-mode="strongest">Strongest</button>
                    <button data-mode="shortest">Shortest</button>
                </div>
                <p class="mode-hint" id="modeHint">Finds the path where every artist connection is as similar as possible</p>
            </div>
            <div class="slider-group">
                <label>Max hops <span id="depthLabel">3</span></label>
                <input type="range" id="depthSlider" min="1" max="6" value="3">
                <p class="mode-hint">Max number of artists between start and target</p>
            </div>
            <button class="search-btn" id="searchBtn">Search</button>
        </div>
    </div>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p class="loading-text">building artist graph — first search may take a moment...</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="results" id="results">
        <div class="results-header">
            <span class="results-title">Connection path</span>
            <span class="path-score-badge" id="scoreBadge"></span>
        </div>
        <div class="path-viz" id="pathViz"></div>
    </div>
</div>
<script>
  const themeToggle = document.getElementById('themeToggle');
  let isLight = false;
  themeToggle.addEventListener('click', () => {
    isLight = !isLight;
    document.documentElement.classList.toggle('light', isLight);
    themeToggle.textContent = isLight ? '☾ dark' : '☀ light';
  });

  let selectedMode = 'strongest';
  const startInput  = document.getElementById('startInput');
  const targetInput = document.getElementById('targetInput');
  const depthSlider = document.getElementById('depthSlider');
  const depthLabel  = document.getElementById('depthLabel');
  const searchBtn   = document.getElementById('searchBtn');
  const loading     = document.getElementById('loading');
  const errorMsg    = document.getElementById('errorMsg');
  const results     = document.getElementById('results');
  const pathViz     = document.getElementById('pathViz');
  const scoreBadge  = document.getElementById('scoreBadge');
  const modeButtons = document.querySelectorAll('.mode-toggle button');

  depthSlider.addEventListener('input', () => { depthLabel.textContent = depthSlider.value; });

  const modeHints = {
    strongest: 'Finds the path where every artist connection is as similar as possible',
    shortest: 'Finds the path with the fewest hops between artists'
  };

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      modeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedMode = btn.dataset.mode;
      document.getElementById('modeHint').textContent = modeHints[selectedMode];
    });
  });

  searchBtn.addEventListener('click', doSearch);
  [startInput, targetInput].forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  });

  async function doSearch() {
    const start  = startInput.value.trim();
    const target = targetInput.value.trim();
    const depth  = depthSlider.value;
    if (!start || !target) { showError('Please enter both a start and target artist.'); return; }
    setLoading(true);
    hideAll();

    const url = `/api/path?start=${encodeURIComponent(start)}&target=${encodeURIComponent(target)}&depth=${depth}&mode=${selectedMode}`;

    // 60 second timeout — first search builds the graph which takes longer
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 60000);

    try {
      const res  = await fetch(url, { signal: controller.signal });
      clearTimeout(timeout);
      const data = await res.json();
      if (!res.ok) { showError(data.error || 'Something went wrong.'); return; }
      if (!data.found) {
        showError(`No path found between "${start}" and "${target}" within ${depth} hop${depth == 1 ? '' : 's'}. Try increasing the max hops.`);
        return;
      }
      renderResults(data);
    } catch (err) {
      clearTimeout(timeout);
      if (err.name === 'AbortError') {
        showError('Request timed out. The server may still be building the graph — please try again.');
      } else {
        showError('Could not reach the server. Make sure the Java server is running.');
      }
    } finally {
      setLoading(false);
    }
  }

  function renderResults(data) {
    const { artists, edgeScores, pathScore, tracks } = data;
    const scoreColor = scoreToColor(pathScore);
    scoreBadge.style.borderColor = scoreColor;
    scoreBadge.style.color = scoreColor;
    scoreBadge.textContent = `path score: ${(pathScore * 100).toFixed(1)}%`;
    pathViz.innerHTML = '';
    artists.forEach((artist, i) => {
      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'path-node';
      const card = document.createElement('div');
      card.className = 'node-card' + (i === 0 ? ' start' : i === artists.length - 1 ? ' end' : '');
      const nameEl = document.createElement('div');
      nameEl.className = 'node-name';
      nameEl.textContent = artist;
      card.appendChild(nameEl);
      const artistTracks = tracks[artist] || [];
      if (artistTracks.length > 0) {
        const ul = document.createElement('ul');
        ul.className = 'node-tracks';
        artistTracks.slice(0, 3).forEach(t => {
          const li = document.createElement('li');
          li.textContent = t;
          li.title = t;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }
      nodeDiv.appendChild(card);
      pathViz.appendChild(nodeDiv);
      if (i < edgeScores.length) {
        const edgeDiv = document.createElement('div');
        edgeDiv.className = 'path-edge';
        const color = scoreToColor(edgeScores[i]);
        const line = document.createElement('div');
        line.className = 'edge-line';
        line.style.background = color;
        line.style.opacity = '0.6';
        edgeDiv.appendChild(line);
        const scoreEl = document.createElement('div');
        scoreEl.className = 'edge-score';
        scoreEl.style.color = color;
        scoreEl.textContent = (edgeScores[i] * 100).toFixed(0) + '%';
        edgeDiv.appendChild(scoreEl);
        pathViz.appendChild(edgeDiv);
      }
    });
    results.classList.add('visible');
  }

  function scoreToColor(score) {
    if (score >= 0.7) return '#1DB954';
    if (score >= 0.4) return '#f0c860';
    return '#f06060';
  }

  function setLoading(on) { searchBtn.disabled = on; loading.classList.toggle('visible', on); }
  function hideAll() { results.classList.remove('visible'); errorMsg.classList.remove('visible'); }
  function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('visible'); }
</script>
</body>
</html>
